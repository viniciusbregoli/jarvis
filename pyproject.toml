[project]
name = "jarvis"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "elevenlabs",
    "lz4>=4.4.5",
    "openwakeword",
    "pyobjc-framework-applicationservices>=12.2.2",
    "pyobjc-framework-avfoundation>=12.2.2",
    "pyobjc-framework-quartz>=12.2.2",
    "rumps>=0.4.0",
    "sounddevice",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
