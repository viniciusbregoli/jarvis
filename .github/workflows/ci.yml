name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    # macOS: the wake word tests synthesize speech with `say`.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check .
      - run: uvx ruff format --check .
      - run: uv run pytest
