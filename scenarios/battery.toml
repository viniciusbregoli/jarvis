# Scenario battery for the voice agent, run by scripts/scenarios.py (see the README).
#
# A scenario is one user turn written on the scenario itself (say, calls, forbid, reply, no_reply) or several turns
# as [[scenario.step]] tables. Tools are mocked: `results` sets what a tool returns (by name), anything else gets a
# generic canned result.
#   calls    tools the agent must call, in order, as a prefix of its calls this turn; "none" means no tool at all.
#            An entry is "tool", "tool_a|tool_b" (either) or { tool = "x", args = { key = value } }.
#   args     a literal (exact match), "re:<regex>" (searched, case-insensitive), "*" (present) or "!" (absent/false)
#   forbid   calls that must not happen in the turn, same shape as calls
#   reply    regex the agent's spoken reply must match; no_reply, one it must not match
#   announce speaking before the first tool call ("Vou procurar...") fails the step unless # Scenarios that expect a tool the code doesn't have yet are reported as skipped.

