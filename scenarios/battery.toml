# --- fixing what is on screen -------------------------------------------------------------------------------------------

[[scenario]]
name = "fix-slide-title"
say = "corrige o slide 4, o título tá errado, devia ser Roadmap 2027"
results = { front_document = "App: Zen | Window: Ideias para o roadmap de 2027 | File: /Users/x/deck/index.html" }
calls = [
  "front_document",
  { tool = "start_task", args = { kind = "edit", path = "re:/deck", reload = true, task = "re:roadmap 2027" } },
]
forbid = [{ tool = "start_task", args = { kind = "desktop" } }]
no_reply = "posso|confirma|quer que"

[[scenario]]
name = "fix-slide-mentions-number"
say = "o slide 4 tá com o título errado, devia ser Roadmap 2027"
results = { front_document = "App: Zen | Window: Ideias para o roadmap de 2027 | File: /Users/x/deck/index.html" }
calls = [
  "front_document",
  { tool = "start_task", args = { kind = "edit", path = "re:/deck", task = "re:(slide|4).*(4|slide)" } },
]

[[scenario]]
name = "fix-then-undo"
results = { front_document = "App: Zen | Window: Ideias para o roadmap de 2027 | File: /Users/x/deck/index.html", start_task = "Started task 3, editing deck. Its result will arrive as an update when it finishes." }

[[scenario.step]]
say = "corrige o slide 4, o título tá errado, devia ser Roadmap 2027"
calls = ["front_document", { tool = "start_task", args = { kind = "edit", reload = true } }]

[[scenario.step]]
say = "[Automatic update, not Vinicius speaking] Background task 3 (corrigir o título do slide 4) done. Result: Troquei o título do slide 4 para Roadmap 2027."
calls = "none"
reply = "."
no_reply = "Paths"

[[scenario.step]]
say = "desfaz"
calls = [{ tool = "undo_task", args = { task_id = 3 } }]

[[scenario]]
name = "fix-paragraph-in-textedit"
say = "arruma esse parágrafo, tá com erro de português"
results = { front_document = "App: TextEdit | Window: carta.txt | File: /Users/x/Documents/cartas/carta.txt" }
calls = ["front_document", { tool = "start_task", args = { kind = "edit", path = "re:carta" } }]

[[scenario]]
name = "fix-web-page-refused"
say = "corrige o título dessa página"
results = { front_document = "App: Zen | Window: Kinebot | URL: https://www.kinebot.com.br/produto" }
calls = ["front_document"]
forbid = [{ tool = "start_task", args = { kind = "edit" } }]
reply = "arquivos? locais|apenas locais|só.*locais|locais"

